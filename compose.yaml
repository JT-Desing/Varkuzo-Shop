services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: varkuzo
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: varkuzo
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('VARKUZO_FAVORITES_KEY', getenv('VARKUZO_FAVORITES_KEY'));
        define('VARKUZO_NEWSLETTER_KEY', getenv('VARKUZO_NEWSLETTER_KEY'));
      VARKUZO_FAVORITES_KEY: ${VARKUZO_FAVORITES_KEY:-}
      VARKUZO_NEWSLETTER_KEY: ${VARKUZO_NEWSLETTER_KEY:-}
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/varkuzo-favorites:/var/www/html/wp-content/plugins/varkuzo-favorites
      - ./wordpress/plugins/varkuzo-newsletter:/var/www/html/wp-content/plugins/varkuzo-newsletter

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - wordpress
    environment:
      WC_STORE_API_URL: http://wordpress/wp-json/wc/store/v1
      NEXT_TELEMETRY_DISABLED: "1"
      VARKUZO_PREVIEW_HOST: ${VARKUZO_PREVIEW_HOST:-}
      VARKUZO_FAVORITES_KEY: ${VARKUZO_FAVORITES_KEY:-}
      VARKUZO_NEWSLETTER_KEY: ${VARKUZO_NEWSLETTER_KEY:-}
      WORDPRESS_PUBLIC_URL: ${WORDPRESS_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["admin"]
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: varkuzo
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/varkuzo-favorites:/var/www/html/wp-content/plugins/varkuzo-favorites
      - ./wordpress/plugins/varkuzo-newsletter:/var/www/html/wp-content/plugins/varkuzo-newsletter
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
  frontend_node_modules:
