<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>text{font-family:Arial,sans-serif}</style>
<rect width="1400" height="1000" fill="#fff"/>
<rect x="36" y="36" width="1328" height="928" fill="none" stroke="#d7d0c8"/>
<text x="70" y="94" fill="#9b1721" font-size="26" font-weight="700" letter-spacing="0" text-anchor="start">VKZ-30 / FICHA PARA MUESTRA Y COTIZACIÓN</text>
<text x="70" y="144" fill="#111" font-size="42" font-weight="800" letter-spacing="0" text-anchor="start">LÍNEAS EN FUGA</text>
<line x1="70" y1="166" x2="1325" y2="166" stroke="#111" stroke-width="3"/>
<text x="70" y="212" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">PRENDA SUPERIOR</text>
<text x="70" y="240" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Boxy oversized; hombro caído, manga amplia. Jersey peinado 220–260 g/m²; algodón 100 % como objetivo. Cuello rib</text>
<text x="70" y="266" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">1×1, pespunte doble en bajo y manga.</text>
<text x="70" y="322" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">TELA SUPERIOR OBJETIVO</text>
<text x="70" y="350" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Jersey 100 % algodón peinado, objetivo 220–260 g/m²; cuello rib 1×1. Confirmar encogimiento y solidez.</text>
<text x="70" y="406" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">PRENDA INFERIOR</text>
<text x="70" y="434" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Pierna ancha; tiro medio-alto, caída larga. Denim rígido 12–13.5 oz; algodón predominante. Pretina con entretela,</text>
<text x="70" y="460" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">cierre metálico, 5 bolsillos y costura de seguridad.</text>
<text x="70" y="516" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">TELA INFERIOR OBJETIVO</text>
<text x="70" y="544" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Denim rígido 12–13.5 oz, algodón predominante; lavado de muestra y prueba de solidez.</text>
<text x="70" y="600" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">MEDIDAS POR DEFINIR</text>
<text x="70" y="628" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">pecho, largo, hombro, manga, cintura, cadera, tiro, muslo, boca y entrepierna</text>
<text x="70" y="684" fill="#9b1721" font-size="13" font-weight="700" letter-spacing="2" text-anchor="start">VALIDACIONES</text>
<text x="70" y="712" fill="#171717" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">gramaje real; composición; encogimiento; solidez de color; lavado; resistencia de costura</text>
<text x="70" y="917" fill="#9b1721" font-size="16" font-weight="700" letter-spacing="0" text-anchor="start">OBJETIVOS DE DESARROLLO: CONFIRMAR TELA, MEDIDAS Y TÉCNICA EN MUESTRA FÍSICA.</text>
<text x="70" y="943" fill="#555" font-size="15" font-weight="400" letter-spacing="0" text-anchor="start">Solicitar patrón, consumo, prueba de lavado y cotización por volumen antes de producción.</text>
</svg>
